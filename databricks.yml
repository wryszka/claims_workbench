# Bricksurance SE — Claims Intelligence Workbench
# Databricks Asset Bundle (DAB).
#   Phase 0: scaffold + synthetic landing-zone data generation (notebook).
#   Phase 1: bronze DLT pipeline (resources/bronze_pipeline.yml).
#
# One-command deploy:  databricks bundle deploy -t dev
#
# --------------------------------------------------------------------------
# CATALOG
# --------------------------------------------------------------------------
# The top-level `catalog` variable is EMPTY by default for portability — the
# Phase 0 setup notebook auto-resolves to the workspace's current catalog at
# run time (spark.catalog.currentCatalog()).
#
# The Phase 1 DLT pipeline, however, needs an EXPLICIT target catalog (a
# pipeline can't resolve a catalog at runtime the way a notebook can). So the
# `dev` target below pins `catalog` to this workspace's catalog. Change that one
# line for another workspace, or override on the CLI:
#   databricks bundle deploy -t dev --var="catalog=my_catalog"
# --------------------------------------------------------------------------

bundle:
  name: claims_workbench

include:
  - resources/*.yml

variables:
  catalog:
    description: >-
      Unity Catalog to deploy into. Empty = Phase 0 notebook auto-resolves to
      the workspace current catalog. Phase 1 (DLT) needs it set — the dev
      target pins it below.
    default: ""
  schema:
    description: Fixed schema for all Claims Workbench objects.
    default: claims_workbench
  warehouse_id:
    description: >-
      SQL warehouse the Phase 3 Lakeview dashboard runs its queries on
      (workspace-specific). Pinned on the dev target below.
    default: ""
  triage_model_version:
    description: >-
      Registered version of model_triage_classifier the Phase 5 triage endpoint
      serves. Set to the version your training run registered (the @champion
      version), e.g. --var="triage_model_version=2". Default 1 = fresh deploy.
    default: "1"
  reserve_model_version:
    description: Registered version of model_reserve_bracket the reserve endpoint serves.
    default: "1"

targets:
  dev:
    mode: development
    default: true
    # Portability: ship with a placeholder host so this bundle is workspace-agnostic.
    # To run locally, set host to your dev workspace URL and uncomment `profile`.
    workspace:
      host: REPLACE-ME            # e.g. https://fevm-lr-serverless-aws-us.cloud.databricks.com
      # profile: DEFAULT
    variables:
      # Phase 1 DLT needs an explicit catalog — pin your dev workspace catalog here.
      catalog: lr_serverless_aws_us_catalog
      schema: claims_workbench
      # Phase 3 Lakeview dashboard — pin your dev SQL warehouse id here.
      warehouse_id: ab79eced8207d29b
