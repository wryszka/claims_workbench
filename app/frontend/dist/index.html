<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Claims Intelligence Workbench — Bricksurance SE</title>
<style>
  :root { --slate:#1e293b; --blue:#2563eb; --bg:#f3f4f6; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background:var(--bg); color:#1e293b; }
  .app { display:flex; min-height:100vh; }
  .side { width:236px; background:var(--slate); color:#fff; display:flex; flex-direction:column; flex-shrink:0; }
  .brand { padding:18px 16px; border-bottom:1px solid rgba(255,255,255,.1); display:flex; gap:10px; align-items:center; }
  .brand b { font-size:14px; } .brand small { color:#94a3b8; font-size:10px; display:block; }
  .nav { flex:1; padding:10px 8px; overflow:auto; } .nav a { display:flex; gap:8px; align-items:center; padding:8px 12px; border-radius:8px; color:#94a3b8; text-decoration:none; font-size:14px; cursor:pointer; }
  .nav a.on { background:rgba(37,99,235,.2); color:#fff; font-weight:600; } .nav a:hover { color:#fff; background:rgba(255,255,255,.05); }
  .nav .navhd { color:#475569; font-size:10px; text-transform:uppercase; letter-spacing:.08em; padding:12px 12px 4px; }
  .foot { padding:12px; border-top:1px solid rgba(255,255,255,.1); display:flex; flex-direction:column; gap:8px; }
  .foot .fbtn { width:100%; border:1px solid rgba(255,255,255,.18); background:rgba(255,255,255,.04); color:#cbd5e1; border-radius:8px; padding:8px 10px; font-size:12px; font-weight:600; cursor:pointer; display:flex; gap:8px; align-items:center; justify-content:center; }
  .foot .fbtn:disabled { opacity:.4; cursor:not-allowed; }
  .foot .fbtn.cached { background:rgba(180,83,9,.25); color:#fcd34d; border-color:#b45309; } .foot .fbtn.live { background:rgba(4,120,87,.25); color:#6ee7b7; border-color:#047857; }
  .foot .fmsg { color:#94a3b8; font-size:10px; min-height:12px; } .foot .ftag { color:#475569; font-size:10px; }
  .main { flex:1; display:flex; flex-direction:column; min-width:0; }
  .top { background:#fff; border-bottom:1px solid #e2e8f0; padding:10px 24px; }
  .top .ctx { color:#94a3b8; font-size:11px; } .top .desc { color:#334155; font-size:13px; margin-top:2px; }
  .content { padding:24px; overflow:auto; } .wrap { max-width:1180px; margin:0 auto; }
  h1 { font-size:20px; margin:0 0 2px; } .sub { color:#64748b; font-size:12px; margin:0 0 18px; }
  .grid4 { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; } .grid3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:16px; } .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  @media(max-width:1000px){ .grid4{grid-template-columns:1fr 1fr;} .grid3,.grid2{ grid-template-columns:1fr; } }
  .card { background:#fff; border:1px solid #e2e8f0; border-radius:12px; padding:16px; }
  .card h2 { font-size:13px; margin:0 0 12px; display:flex; gap:6px; align-items:center; }
  .row { display:flex; justify-content:space-between; gap:12px; font-size:14px; padding:4px 0; border-bottom:1px solid #f1f5f9; }
  .row:last-child { border:0; } .row .k { color:#64748b; } .row .v { text-align:right; }
  .badge { font-size:11px; font-weight:600; padding:2px 8px; border-radius:999px; }
  .b-blue { background:#dbeafe; color:#1d4ed8; } .b-green { background:#d1fae5; color:#047857; } .b-slate { background:#f1f5f9; color:#475569; } .b-amber { background:#fef3c7; color:#b45309; } .b-red { background:#fee2e2; color:#b91c1c; }
  .tile { background:#fff; border:1px solid #e2e8f0; border-radius:12px; padding:14px 16px; }
  .tile .l { font-size:11px; color:#64748b; text-transform:uppercase; letter-spacing:.03em; } .tile .n { font-size:24px; font-weight:800; margin-top:2px; } .tile .s { font-size:11px; color:#94a3b8; }
  .tile.hero { background:linear-gradient(135deg,#1e3a8a,#2563eb); color:#fff; } .tile.hero .l { color:#bfdbfe; } .tile.hero .s { color:#bfdbfe; }
  .decision { color:#fff; border-radius:10px; padding:12px; text-align:center; margin-bottom:12px; }
  .decision .d { font-size:20px; font-weight:800; letter-spacing:.03em; } .decision .c { font-size:13px; opacity:.9; }
  .reasons li { font-size:14px; color:#334155; margin:2px 0; } .reasons { padding-left:18px; margin:6px 0; }
  .bar { height:8px; border-radius:999px; background:#f1f5f9; overflow:hidden; } .bar > div { height:100%; }
  .synth { border:1px solid #bfdbfe; background:rgba(239,246,255,.5); border-radius:12px; padding:16px; margin-top:16px; }
  .synth p { white-space:pre-wrap; line-height:1.55; font-size:14px; color:#334155; }
  .pill { font-size:11px; padding:2px 8px; border-radius:999px; } .pill.hit{ background:#fef3c7; color:#b45309;} .pill.live{ background:#d1fae5; color:#047857;}
  .actions { border:1px solid #e2e8f0; background:#fff; border-radius:12px; padding:16px; margin-top:16px; display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  .primary { background:var(--blue); color:#fff; border:0; border-radius:8px; padding:9px 16px; font-weight:700; font-size:14px; cursor:pointer; }
  .ghost { border:1px solid #fbbf24; color:#b45309; background:#fff; border-radius:8px; padding:9px 16px; font-weight:700; font-size:14px; cursor:pointer; }
  .ok { color:#047857; font-weight:600; } select,input,textarea { border:1px solid #cbd5e1; border-radius:8px; padding:8px 10px; font-size:14px; font-family:inherit; }
  table { width:100%; border-collapse:collapse; font-size:13px; } th { text-align:left; color:#64748b; border-bottom:1px solid #f1f5f9; padding:6px 4px; }
  td { padding:6px 4px; border-bottom:1px solid #f8fafc; } .mono { font-family: ui-monospace, monospace; font-size:12px; }
  .spacer { flex:1; } a.link { color:var(--blue); font-size:12px; text-decoration:none; } a.link:hover { text-decoration:underline; }
  .muted { color:#94a3b8; font-size:12px; }
  .disclaimer { background:#fffbeb; border:1px solid #fcd34d; border-radius:12px; padding:12px 16px; font-size:12px; color:#92400e; line-height:1.5; margin-bottom:18px; }
  .slider { width:100%; } .slider-row { display:flex; gap:8px; align-items:center; margin:8px 0; } .slider-row label { width:120px; font-size:12px; color:#64748b; } .slider-row .val { width:96px; text-align:right; font-weight:700; font-size:13px; }
  .lens li { font-size:13px; color:#334155; margin:6px 0; line-height:1.45; }
  .ph { background:repeating-linear-gradient(45deg,#f8fafc,#f8fafc 10px,#f1f5f9 10px,#f1f5f9 20px); border:1px dashed #cbd5e1; border-radius:10px; padding:12px; color:#94a3b8; }
  .ph b { color:#64748b; display:block; font-size:13px; margin-bottom:2px; } .ph .uc { font-size:10px; text-transform:uppercase; letter-spacing:.05em; color:#b45309; background:#fef3c7; border-radius:999px; padding:1px 7px; }
  .askbox { display:flex; gap:8px; } .askbox textarea { flex:1; min-height:46px; resize:vertical; }
  .qchip { display:inline-block; font-size:12px; color:#334155; background:#f1f5f9; border:1px solid #e2e8f0; border-radius:999px; padding:5px 11px; margin:3px; cursor:pointer; } .qchip:hover { background:#dbeafe; border-color:#bfdbfe; }
  .qgrp { margin:8px 0; } .qgrp .gl { font-size:11px; font-weight:700; color:#475569; text-transform:uppercase; letter-spacing:.03em; }
  .diagram { display:flex; flex-direction:column; align-items:center; gap:10px; padding:8px 0; }
  .sup { background:#1e3a8a; color:#fff; border-radius:10px; padding:10px 18px; font-weight:700; font-size:14px; }
  .agents { display:flex; flex-wrap:wrap; gap:10px; justify-content:center; }
  .agbox { background:#fff; border:1px solid #cbd5e1; border-radius:10px; padding:8px 12px; width:200px; } .agbox b { font-size:12px; } .agbox span { font-size:11px; color:#64748b; display:block; }
  .agbox.tool { border-color:#bfdbfe; background:#eff6ff; } .agbox.genie { border-color:#a7f3d0; background:#ecfdf5; }
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><span style="font-size:22px">🛡️</span><div><b>Claims Intelligence</b><small>Bricksurance SE</small></div></div>
    <nav class="nav" id="nav"></nav>
    <div class="foot">
      <button class="fbtn" id="cacheBtn" onclick="toggleCache()">AI: …</button>
      <button class="fbtn" id="resetBtn" onclick="resetDemo()">↺ Reset demo</button>
      <div class="fmsg" id="resetMsg"></div>
      <div class="ftag">Synthetic demo accelerator — not a Databricks product</div>
    </div>
  </aside>
  <div class="main">
    <div class="top"><div class="ctx">Bricksurance SE · Claims Intelligence Workbench</div><div class="desc" id="pagedesc"></div></div>
    <div class="content"><div class="wrap" id="view"></div></div>
  </div>
</div>
<script>
const SECTIONS = [
  {id:'control', label:'🎛️ Control Tower', grp:'Operate'},
  {id:'claimsai', label:'✨ Claims AI', grp:'Operate'},
  {id:'ingestion', label:'📥 Ingestion', grp:'Pipeline'},
  {id:'transformation', label:'🧩 Transformation', grp:'Pipeline'},
  {id:'governance', label:'🛡️ Governance & Portfolio', grp:'Pipeline'},
  {id:'learn', label:'🎓 Learn', grp:'Reference'},
  {id:'roadmap', label:'🚧 Roadmap', grp:'Reference'},
];
const DESC = {
  control:'This page is the demo home: portfolio health at a glance — how many claims are open, escalated or auto-closed, what needs attention, and a live auto-close threshold slider.',
  claimsai:'This page is the unified Claims AI window: ask any question and it routes through the managed supervisor to the right agent. Below, pick a claim to see triage, reserve, fraud and the orchestrated brief.',
  ingestion:'This page shows your Guidewire data landing in Databricks and the quality gate that quarantines bad records — nothing is silently dropped.',
  transformation:'This page shows the silver enrichment for one claim — everything we know before a handler picks up the phone.',
  governance:'This page is for compliance: the board dashboard, lineage, who-sees-what, and the regulator-viewable decision audit.',
  learn:'This page is for Databricks colleagues learning to pitch claims — plain-English concepts, an insurance glossary, and the flow through company systems.',
  governance:'This page is for compliance: the board dashboard, what data is collected and its sensitivity tier, lineage, and the regulator-viewable agent-reasoning audit.',
  roadmap:'This page shows what is intentionally NOT built yet — the roadmap of intake, integration, downstream and specialty capabilities.',
};
const state = { section:'control', cid:'cc:900001', claims:[], panels:null, synth:null, cache:null, overriding:false, confirmation:null, ct:null, lens:null, cfg:null, ask:null, asking:false };
const gbp = v => { const n=parseFloat(v); return isNaN(n)?'—':'£'+n.toLocaleString('en-GB',{maximumFractionDigits:0}); };
const num = v => { const n=parseFloat(v); return isNaN(n)?'—':n.toLocaleString('en-GB'); };
const pct = v => { const n=parseFloat(v); return isNaN(n)?'—':n.toFixed(1)+'%'; };
const DLABEL = { pay_direct:'PAY DIRECT', escalate:'ESCALATE', refer_siu:'REFER TO SIU' };
const PERIL = { motor_tp:'Motor Third Party', home_escape_water:'Home — Escape of Water', home_storm:'Home — Storm', home_fire:'Home — Fire' };
const esc = s => (s==null?'':String(s)).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function J(path, opts){ const r=await fetch('/api'+path, {headers:{'Content-Type':'application/json'}, ...opts}); if(!r.ok) throw new Error(r.status); return r.json(); }

function renderNav(){
  let html='', grp='';
  for(const s of SECTIONS){ if(s.grp!==grp){ grp=s.grp; html+=`<div class="navhd">${grp}</div>`; }
    html+=`<a class="${state.section===s.id?'on':''}" onclick="go('${s.id}')">${s.label}</a>`; }
  document.getElementById('nav').innerHTML = html;
}
function go(s){ state.section=s; renderNav(); document.getElementById('pagedesc').textContent=DESC[s]||''; render(); }

async function initFoot(){
  try{ const d=await J('/cache-mode'); state.cache=d.use_cache; }catch(e){ state.cache=true; }
  const b=document.getElementById('cacheBtn'); b.className='fbtn '+(state.cache?'cached':'live'); b.textContent='AI: '+(state.cache?'cached':'live');
  try{ const r=await J('/reset-status'); const rb=document.getElementById('resetBtn'); if(!r.available){ rb.disabled=true; rb.textContent='↺ Reset (Phase 9)'; } }catch(e){}
}
async function toggleCache(){ const d=await J('/cache-mode',{method:'POST',body:JSON.stringify({use_cache:!state.cache})}); state.cache=d.use_cache; const b=document.getElementById('cacheBtn'); b.className='fbtn '+(state.cache?'cached':'live'); b.textContent='AI: '+(state.cache?'cached':'live'); }
let _resetTimer=null;
async function resetDemo(){ const m=document.getElementById('resetMsg'); m.textContent='Triggering…';
  try{ const d=await J('/reset-demo',{method:'POST',body:'{}'}); if(!d.triggered){ m.textContent=d.message||'unavailable'; return; }
    document.getElementById('resetBtn').disabled=true; pollReset(d.run_id, Date.now());
  }catch(e){ m.textContent='unavailable'; } }
function pollReset(rid, t0){ const m=document.getElementById('resetMsg'); clearInterval(_resetTimer);
  const tick=async()=>{ try{ const r=await J('/reset-run?run_id='+rid); const mins=Math.round((Date.now()-t0)/60000);
      if((r.life_cycle||'').includes('TERMINATED')){ clearInterval(_resetTimer); document.getElementById('resetBtn').disabled=false;
        m.textContent=(r.result||'').includes('SUCCESS')?'✓ Reset complete':'Reset failed'; if((r.result||'').includes('SUCCESS')) location.reload(); }
      else { m.textContent=`Reset running… ${mins}m`; }
    }catch(e){} };
  tick(); _resetTimer=setInterval(tick, 15000); }

function render(){
  const r={ control:renderControl, claimsai:renderClaimsAI, ingestion:renderIngestion, transformation:renderTransformation, governance:renderGovernance, learn:renderLearn, roadmap:renderRoadmap }[state.section];
  if(r) r();
}

// ---------- Control Tower ----------
const DISCLAIMER = "About this demonstration — Bricksurance SE is a synthetic insurer. All data shown is generated; there is no real Guidewire integration and no real customer data. Figures illustrate the Databricks platform, not a real book of business. Decisions are model and workflow outputs with a human in the loop; the AI agents provide reasoning and second opinions and have no payment authority. This is a demo accelerator, not a Databricks product.";
async function renderControl(){
  const v=document.getElementById('view'); v.innerHTML='<h1>🎛️ Control Tower</h1><p class="sub">Loading portfolio…</p>';
  try{ state.ct=await J('/control-tower'); }catch(e){ v.innerHTML='<h1>Control Tower</h1><p class="muted">Unavailable.</p>'; return; }
  try{ state.lens=await J('/monitoring-lens'); }catch(e){ state.lens=null; }
  try{ state.cfg=await J('/auto-close/config'); }catch(e){ state.cfg={conf_threshold:85,amount_cap:2000,fraud_floor:20}; }
  const t=state.ct;
  const tile=(l,n,s,cls)=>`<div class="tile ${cls||''}"><div class="l">${l}</div><div class="n">${n}</div><div class="s">${s||''}</div></div>`;
  v.innerHTML = `<h1>🎛️ Control Tower</h1><p class="sub">Bricksurance SE claims book — health at a glance.</p>
    <div class="disclaimer"><b>About this demo.</b> ${esc(DISCLAIMER)}</div>
    <div class="grid4" style="margin-bottom:14px">
      ${tile('% Auto-closed', pct(t.pct_auto_closed), num(t.auto_closed)+' straight-through', 'hero')}
      ${tile('Open', num(t.open), 'first notice / in progress')}
      ${tile('Escalated', num(t.escalated), 'routed to a handler')}
      ${tile('Outstanding', num(t.outstanding), 'not yet settled')}
    </div>
    <div class="grid4" style="margin-bottom:14px">
      ${tile('Aged / SLA risk', num(t.aged), '>30 days open', 'tile')}
      ${tile('Large losses', num(t.large_losses), 'over £50,000')}
      ${tile('Total reserves', gbp(t.total_reserves), 'outstanding')}
      ${tile('Fraud-refer rate', pct(t.fraud_refer_rate), 'elevated signals')}
    </div>
    <div class="grid4" style="margin-bottom:16px">
      ${tile('Closed', num(t.closed), 'settled')}
      ${tile('Declined', num(t.declined), '')}
      ${tile('Leakage rate', pct(t.leakage_rate), 'overpayment proxy')}
      ${tile('Avg settlement', (t.avg_settle_days??'—')+' d', 'days to settle')}
    </div>
    <div class="grid2">
      <div class="card"><h2>👁️ Monitoring lens — what needs your attention</h2>
        ${state.lens&&state.lens.items?`<ul class="lens">${state.lens.items.map(i=>`<li>${esc(i)}</li>`).join('')}</ul>`:'<p class="muted">Lens unavailable.</p>'}
        <p class="muted" style="margin-top:6px">Computed from the live book; can be narrated by the Claims AI supervisor.</p></div>
      <div class="card"><h2>🎚️ Auto-close risk appetite — re-segment live</h2>
        <p class="muted" style="margin-bottom:6px">Move the thresholds to see how many claims straight-through-process. The workflow decides — no agent has pay authority.</p>
        <div class="slider-row"><label>Min confidence</label><input class="slider" type="range" id="s_conf" min="50" max="99" value="${t.pct_auto_closed!=null?Math.round(state.cfg.conf_threshold):85}" oninput="segChange()"><span class="val" id="v_conf">${Math.round(state.cfg.conf_threshold)}%</span></div>
        <div class="slider-row"><label>Max amount</label><input class="slider" type="range" id="s_cap" min="250" max="10000" step="250" value="${Math.round(state.cfg.amount_cap)}" oninput="segChange()"><span class="val" id="v_cap">${gbp(state.cfg.amount_cap)}</span></div>
        <div class="slider-row"><label>Max fraud score</label><input class="slider" type="range" id="s_fraud" min="0" max="100" value="${Math.round(state.cfg.fraud_floor)}" oninput="segChange()"><span class="val" id="v_fraud">${Math.round(state.cfg.fraud_floor)}</span></div>
        <div style="margin-top:10px;text-align:center"><div style="font-size:30px;font-weight:800;color:#2563eb" id="seg_pct">${pct(t.pct_auto_closed)}</div><div class="muted" id="seg_n">${num(t.auto_closed)} auto-closed · ${num(t.escalated)} escalated</div></div>
      </div>
    </div>
    <div class="card" style="margin-top:16px"><h2>🚧 Roadmap — under construction</h2>${roadmapStrip()}
      <p class="muted" style="margin-top:8px">Greyed = intentionally not built. Full detail on the Roadmap page.</p></div>`;
}
let _segTimer=null;
function segChange(){
  const conf=+document.getElementById('s_conf').value, cap=+document.getElementById('s_cap').value, fraud=+document.getElementById('s_fraud').value;
  document.getElementById('v_conf').textContent=conf+'%'; document.getElementById('v_cap').textContent=gbp(cap); document.getElementById('v_fraud').textContent=fraud;
  clearTimeout(_segTimer); _segTimer=setTimeout(async()=>{
    try{ const r=await J(`/auto-close/segment?conf=${conf}&cap=${cap}&fraud=${fraud}`);
      document.getElementById('seg_pct').textContent=pct(r.pct_auto_closed);
      document.getElementById('seg_n').textContent=`${num(r.auto_closed)} auto-closed · ${num(r.escalated)} escalated`;
    }catch(e){}
  }, 250);
}
const ROADMAP = {
  'Intake & documents':['Document classification','Email → structured extraction','Translation','Damage-photo analysis'],
  'System integration':['CMS write-back','Lakebase-as-CMS','Zero-copy to underwriting'],
  'Downstream':['Compliance / finance checks','Payment execution','Litigation routing'],
  'Specialty':['Marine contagion','Parametric / satellite payout','IoT verification','SDI'],
  'Enrichment':['D&B / S&P / Moody’s','Telematics'],
};
function roadmapStrip(){ return `<div class="grid3">${Object.entries(ROADMAP).map(([g,items])=>`<div class="ph"><b>${esc(g)} <span class="uc">soon</span></b>${items.map(i=>`<div>• ${esc(i)}</div>`).join('')}</div>`).join('')}</div>`; }

// ---------- Claims AI (unified ask-window + claim triage) ----------
const AGENT_QS = [
  ['Claim 360 / Dossier', ['Give me the full Claim 360 dossier for cc:900001']],
  ['Challenge / Second-Opinion', ['Give me a second opinion on cc:900002 — argue the opposite of the disposition']],
  ['Fraud', ['What is the fraud risk on cc:900001 and why?']],
  ['Recovery / Subrogation', ['Is there any recovery or subrogation potential on cc:900001?']],
  ['Audit / Reasoning', ['Explain for a regulator why cc:900002 was auto-closed']],
  ['Genie analytics', ['Which districts have the worst escape-of-water leakage?','What is the loss ratio by product?']],
];
const ROSTER = [
  ['Claim 360 / Dossier','Everything in one place — policy, history, fraud, recovery, enrichment','agbox'],
  ['Challenge / Second-Opinion','Argues the opposite of the disposition','agbox'],
  ['Fraud','LOW / MEDIUM / HIGH risk with the signals behind it','agbox'],
  ['Recovery / Subrogation','Recovery potential + recoverable £','agbox'],
  ['Audit / Reasoning','Regulator-readable explanation of the decision','agbox'],
  ['Triage & Reserve (model tools)','UC functions scoring the ML models','agbox tool'],
  ['Ask the Book (Genie)','Portfolio analytics in natural language','agbox genie'],
  ['Ask Pricing + Claims (Genie)','Cross-domain: loss ratio, premium adequacy','agbox genie'],
];
async function loadClaims(){ try{ state.claims=await J('/claims'); }catch(e){ state.claims=[]; } }
async function doAsk(q, cid){ state.ask={q, loading:true}; state.asking=true; renderClaimsAI();
  try{ const r=await J('/ask',{method:'POST',body:JSON.stringify({question:q, cid:cid||null})}); state.ask={q, ...r}; }
  catch(e){ state.ask={q, __err:true}; } state.asking=false; renderClaimsAI(); }
function askFromBox(){ const q=document.getElementById('askbox').value.trim(); if(q) doAsk(q, state.cid); }
async function selectClaim(cid){ state.cid=cid; state.panels=null; state.synth=null; state.confirmation=null; state.overriding=false; state.disp=null; state.reason=null; renderClaimsAI();
  try{ state.panels=await J('/claim/panels?cid='+encodeURIComponent(cid)); }catch(e){ state.panels={__err:true}; }
  try{ state.disp=await J('/claim/disposition?cid='+encodeURIComponent(cid)); }catch(e){ state.disp=null; }
  renderClaimsAI();
  try{ state.reason=await J('/claim/reasoning?cid='+encodeURIComponent(cid)); }catch(e){ state.reason=[]; }
  try{ state.synth=await J('/claim/synthesis?cid='+encodeURIComponent(cid)); }catch(e){ state.synth={__err:true}; }
  renderClaimsAI();
}
function renderClaimsAI(){
  const v=document.getElementById('view');
  // --- ask-window ---
  const a=state.ask;
  let askHtml=`<div class="card" style="margin-bottom:16px"><h2>✨ Ask Claims AI</h2>
    <div class="askbox"><textarea id="askbox" placeholder="Ask anything — e.g. how should I handle cc:900001? Which districts leak most?">${a&&!a.loading?esc(a.q):''}</textarea>
      <button class="primary" onclick="askFromBox()" ${state.asking?'disabled':''}>${state.asking?'Asking…':'Ask'}</button></div>`;

  let body='';

        <div style="background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:8px"><b style="font-size:14px">Reserve: ${esc(r.bracket)||'—'}</b><div class="muted">${esc(r.estimated_range)}</div></div>

function synthPill(){ const s=state.synth; if(!s||s.__err) return ''; return `<span class="pill ${s.cache==='hit'?'hit':'live'}">${s.cache==='hit'?'cached':'live'}</span>`; }
function synthBody(){ const s=state.synth; if(!s) return '<p class="muted">Synthesising…</p>'; if(s.__err) return '<p class="muted">Synthesis unavailable.</p>'; return `<p>${esc(s.text)}</p>${s.supervisor?'':'<p class="muted" style="font-size:11px;margin-top:6px">via Context agent — managed Supervisor pending (RUNBOOK Stage C).</p>'}`; }
function actionBar(){
  const c=state.confirmation, t=(state.panels&&state.panels.triage)||{};
  if(c){ return `<span class="ok">✓ Decision logged · ${esc(c.decision_id)} · ${DLABEL[c.model_recommendation]||esc(c.model_recommendation)} · ${c.override_flag?('OVERRIDE ('+esc(c.override_reason)+')'):'ACCEPTED'} · ${esc(c.time)}</span><span class="spacer"></span><a class="link" onclick="selectClaim(state.cid)">Next claim</a>`; }
  if(state.overriding){ const reasons=['Insufficient evidence','Customer relationship','Local knowledge','Other'];
    return `<span>⚠️ Override reason:</span><select id="ovr">${reasons.map(r=>`<option>${r}</option>`).join('')}</select><button class="ghost" onclick="decide('override')">Confirm Override</button><a class="link" onclick="state.overriding=false;renderClaimsAI()">Cancel</a>`; }

async function decide(action){

// ---------- Learn ----------
const GLOSSARY = [
  ['FNOL','First Notice of Loss — the moment a claim is first reported (call, app, broker). The trigger for everything downstream.'],
  ['Triage','Deciding how to handle a claim at FNOL: pay directly, escalate to a handler, or refer to the fraud unit (SIU).'],
  ['Reserve','Money set aside for a claim before it is fully paid. Under-reserving means surprises later; the reserve model estimates the bracket.'],
  ['Indemnity','Putting the policyholder back in the position they were in before the loss — the core promise of insurance.'],
  ['Subrogation / Recovery','Recovering money from a third party (or their insurer) when they were at fault — e.g. a not-at-fault motor claim.'],
  ['Leakage','Money paid out that need not have been — overpayment, missed recovery, or poor handling. A key efficiency metric.'],
  ['SIU','Special Investigations Unit — the fraud team a claim is referred to when signals are elevated.'],
  ['Peril','The cause of loss — e.g. motor third-party, escape of water, storm, fire.'],
  ['Loss ratio','Claims incurred ÷ premium earned. The headline measure of underwriting profitability.'],
  ['Straight-through processing (STP)','A clean, low-risk claim that is auto-closed and paid with no manual handling — the auto-close path here.'],
  ['Ultimate / outstanding','Ultimate = total the claim will ever cost; outstanding = what is still reserved but unpaid.'],
  ['Consumer Duty / FCA','UK regulatory expectations — fair, explainable, auditable treatment of customers. Why the decision trail matters.'],
];
const FLOW = [
  ['FNOL','Claim reported','Guidewire ClaimCenter'],
  ['Triage','Pay / escalate / refer','ML model + workflow'],
  ['Reserve','Set money aside','Reserve model + finance'],
  ['Settle','Pay the claim','ClaimCenter + finance / payments'],
  ['Recover','Subrogate from third party','Recovery / SIU'],
  ['Close','Audit & report','CMS + board reporting'],
];
function renderLearn(){ document.getElementById('view').innerHTML=`<h1>🎓 Learn — claims for Databricks colleagues</h1><p class="sub">Plain-English primer to help you pitch. Skim it once and you can carry the conversation.</p>
  <div class="card" style="margin-bottom:16px"><h2>What is a claim, really?</h2>
    <p style="font-size:14px;color:#334155;line-height:1.6">A policyholder suffers a loss — a car bump, a burst pipe — and tells the insurer (that's <b>FNOL</b>). The insurer decides how to handle it (<b>triage</b>), sets money aside (<b>reserve</b>), pays what's owed (<b>settle</b>), claws back anything recoverable from a third party (<b>recover</b>), and closes the file with a full audit trail. Do this faster and fairer and you win on cost, customer experience and regulatory standing all at once. That's the whole game — and it's what this workbench shows end to end.</p></div>
  <div class="card" style="margin-bottom:16px"><h2>🔄 The flow through the company's systems</h2>
    <div class="agents" style="justify-content:flex-start">${FLOW.map((f,i)=>`<div class="agbox" style="width:160px"><b>${i+1}. ${esc(f[0])}</b><span>${esc(f[1])}</span><span style="color:#2563eb;margin-top:4px">${esc(f[2])}</span></div>${i<FLOW.length-1?'<div style="align-self:center;color:#94a3b8">→</div>':''}`).join('')}</div>
    <p class="muted" style="margin-top:8px">Guidewire ClaimCenter / PolicyCenter feed the data; the ML models + workflow decide; finance and payments execute; a claims management system (CMS) and board reporting close the loop. Databricks sits underneath as the data + AI platform.</p></div>
  <div class="card"><h2>📖 Glossary — insurance 101</h2>
    <div class="grid2">${GLOSSARY.map(([t,d])=>`<div class="row" style="align-items:flex-start"><span class="k" style="width:150px;flex-shrink:0;font-weight:700;color:#334155">${esc(t)}</span><span class="v" style="text-align:left;color:#475569;font-size:13px">${esc(d)}</span></div>`).join('')}</div>
    <p class="muted" style="margin-top:8px">Drafted insurance-101 glossary — swap in your standard glossary text if you have one.</p></div>`; }
