<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Claims Intelligence Workbench — Bricksurance SE</title>
<style>
  :root{ --v:#2563eb; --v7:#1d4ed8; --v50:#eff6ff; --v100:#dbeafe; --ink:#0f172a; --muted:#64748b;
         --line:#e6e8ec; --bg:#f6f7f9; --card:#fff; }
  *{ box-sizing:border-box; }
  body{ margin:0; font-family:"Inter",system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--ink); -webkit-font-smoothing:antialiased; }
  .app{ display:flex; min-height:100vh; }
  /* sidebar */
  .side{ width:248px; background:#0b1220; color:#fff; display:flex; flex-direction:column; flex-shrink:0; position:sticky; top:0; height:100vh; }
  .brand{ padding:20px 18px; border-bottom:1px solid rgba(255,255,255,.08); display:flex; gap:11px; align-items:center; }
  .brand .logo{ width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#2563eb,#3b82f6);display:flex;align-items:center;justify-content:center;font-size:18px; }
  .brand b{ font-size:14px; letter-spacing:-.01em; } .brand small{ color:#8b95a7; font-size:10px; display:block; margin-top:1px; }
  .nav{ flex:1; padding:12px 10px; overflow:auto; } .navhd{ color:#566177; font-size:10px; text-transform:uppercase; letter-spacing:.1em; padding:14px 12px 5px; font-weight:700; }
  .nav a{ display:flex; gap:10px; align-items:center; padding:9px 12px; border-radius:9px; color:#aeb6c6; text-decoration:none; font-size:13.5px; cursor:pointer; font-weight:500; }
  .nav a.on{ background:rgba(37,99,235,.22); color:#fff; font-weight:600; box-shadow:inset 0 0 0 1px rgba(37,99,235,.4); } .nav a:hover{ color:#fff; background:rgba(255,255,255,.05); }
  .foot{ padding:12px; background:#fff; border-top:1px solid var(--line); display:flex; flex-direction:column; gap:4px; }
  .learncard{ display:flex; gap:10px; align-items:center; padding:10px 11px; margin-bottom:8px; border-radius:11px; background:#ecfdf5; border:1px solid #a7f3d0; cursor:pointer; }
  .learncard:hover{ background:#d1fae5; } .learncard .lic{ width:30px;height:30px;border-radius:8px;background:#10b981;color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0; }
  .learncard b{ font-size:13px; color:var(--ink); display:block; line-height:1.15; } .learncard small{ font-size:11px; color:#047857; }
  .ctl{ display:flex; align-items:center; justify-content:space-between; gap:8px; padding:5px 2px; }
  .ctl-l{ font-size:12.5px; font-weight:700; color:var(--ink); } .ctl-s{ font-size:10.5px; color:var(--muted); margin-top:1px; }
  .pill{ border:1px solid #f59e0b; background:#fffbeb; color:#b45309; border-radius:8px; padding:6px 11px; font-size:11px; font-weight:700; cursor:pointer; display:flex; gap:6px; align-items:center; white-space:nowrap; }
  .pill:disabled{ opacity:.5; cursor:not-allowed; } .pill.gray{ border-color:var(--line); background:#fff; color:#475569; } .pill.live{ border-color:#10b981; background:#ecfdf5; color:#047857; }
  .fmsg{ color:var(--muted); font-size:10px; min-height:12px; } .ftag{ color:#94a3b8; font-size:10px; line-height:1.4; margin-top:4px; }
  /* main */
  .main{ flex:1; display:flex; flex-direction:column; min-width:0; }
  .content{ padding:32px 40px 60px; overflow:auto; } .wrap{ max-width:1180px; margin:0 auto; }
  .eyebrow{ color:var(--v7); font-size:11px; font-weight:800; letter-spacing:.13em; text-transform:uppercase; margin-bottom:6px; }
  h1.big{ font-size:30px; font-weight:800; letter-spacing:-.02em; margin:0 0 8px; line-height:1.12; }
  .lead{ color:#475569; font-size:14.5px; max-width:760px; line-height:1.55; margin:0 0 26px; }
  .pagedesc{ background:#fff; border:1px solid var(--line); border-left:3px solid var(--v); border-radius:10px; padding:11px 15px; font-size:13px; color:#475569; margin-bottom:24px; }
  .grid4{ display:grid; grid-template-columns:repeat(4,1fr); gap:14px; } .grid3{ display:grid; grid-template-columns:repeat(3,1fr); gap:16px; } .grid2{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  @media(max-width:1040px){ .grid4{grid-template-columns:1fr 1fr;} .grid3,.grid2{grid-template-columns:1fr;} }
  .card{ background:var(--card); border:1px solid var(--line); border-radius:14px; padding:18px; box-shadow:0 1px 2px rgba(16,24,40,.04); }
  .card h2{ font-size:14px; margin:0 0 14px; display:flex; gap:8px; align-items:center; letter-spacing:-.01em; }
  .row{ display:flex; justify-content:space-between; gap:12px; font-size:14px; padding:6px 0; border-bottom:1px solid #f1f3f6; } .row:last-child{border:0;}
  .row .k{ color:var(--muted); } .row .v{ text-align:right; font-weight:500; }
  .badge{ font-size:11px; font-weight:700; padding:2px 9px; border-radius:999px; }
  .b-blue{background:#dbeafe;color:#1d4ed8;} .b-green{background:#d1fae5;color:#047857;} .b-slate{background:#f1f5f9;color:#475569;} .b-amber{background:#fef3c7;color:#b45309;} .b-red{background:#fee2e2;color:#b91c1c;} .b-violet{background:var(--v100);color:var(--v7);}
  .tile{ background:#fff; border:1px solid var(--line); border-radius:14px; padding:16px 18px; box-shadow:0 1px 2px rgba(16,24,40,.04); }
  .tile .l{ font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; font-weight:700; } .tile .n{ font-size:25px; font-weight:800; margin-top:3px; letter-spacing:-.02em; } .tile .s{ font-size:11px; color:#94a3b8; margin-top:1px; }
  .tile.hero{ background:linear-gradient(135deg,#5b21b6,#2563eb); color:#fff; border:0; } .tile.hero .l{color:#bfdbfe;} .tile.hero .s{color:#bfdbfe;}
  .btnv{ background:var(--v); color:#fff; border:0; border-radius:9px; padding:10px 18px; font-weight:700; font-size:14px; cursor:pointer; } .btnv:disabled{opacity:.5;cursor:not-allowed;}
  .ghost{ border:1px solid #f59e0b; color:#b45309; background:#fff; border-radius:9px; padding:9px 16px; font-weight:700; font-size:14px; cursor:pointer; }
  input,select,textarea{ border:1px solid #cbd5e1; border-radius:9px; padding:10px 12px; font-size:14px; font-family:inherit; }
  table{ width:100%; border-collapse:collapse; font-size:13px; } th{ text-align:left; color:var(--muted); border-bottom:1px solid var(--line); padding:8px 6px; font-weight:600; }
  td{ padding:8px 6px; border-bottom:1px solid #f4f5f8; vertical-align:top; } .mono{ font-family:ui-monospace,SFMono-Regular,monospace; font-size:12px; }
  a.link{ color:var(--v7); text-decoration:none; font-weight:600; } a.link:hover{ text-decoration:underline; } .muted{ color:#94a3b8; font-size:12px; } .spacer{flex:1;}
  /* tabs */
  .tabs{ display:flex; gap:4px; border-bottom:1px solid var(--line); margin-bottom:22px; } .tab{ padding:10px 16px; font-size:13.5px; font-weight:600; color:var(--muted); cursor:pointer; border-bottom:2px solid transparent; }
  .tab.on{ color:var(--v7); border-bottom-color:var(--v); }
  /* ask card */
  .ask{ border:1px solid var(--line); border-radius:16px; overflow:hidden; background:#fff; box-shadow:0 1px 3px rgba(16,24,40,.05); }
  .ask .hd{ background:var(--v50); border-bottom:1px solid var(--v100); padding:13px 18px; display:flex; align-items:center; justify-content:space-between; }
  .ask .hd b{ color:var(--v7); font-size:14px; display:flex; gap:8px; align-items:center; } .ask .hd .ro{ color:var(--v7); font-size:11px; font-weight:800; letter-spacing:.08em; }
  .ask .bd{ padding:18px; }
  .qgrid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:10px 0 16px; } @media(max-width:820px){ .qgrid{grid-template-columns:1fr;} }
  .qcell{ border:1px solid var(--line); border-radius:11px; padding:12px 14px; cursor:pointer; background:#fff; } .qcell:hover{ border-color:#93c5fd; background:var(--v50); }
  .qcell .q{ font-size:13.5px; color:var(--ink); font-weight:500; } .qcell .r{ font-size:12px; color:var(--v7); font-weight:600; margin-top:3px; }
  .askbox{ display:flex; gap:10px; } .askbox input{ flex:1; }
  /* agent cards */
  .agwrap{ max-width:920px; margin:0 auto; }
  .supcard{ max-width:430px; margin:0 auto 18px; border:1.5px solid var(--v); border-radius:16px; padding:20px; text-align:center; background:linear-gradient(160deg,#eff6ff,#eff6ff); }
  .supcard .e{ color:var(--v7); font-size:10px; font-weight:800; letter-spacing:.13em; text-transform:uppercase; } .supcard h3{ color:var(--v7); font-size:20px; margin:4px 0 10px; }
  .supcard p{ color:#5b21b6; font-size:13px; line-height:1.55; margin:0 0 12px; } .supcard .ep{ border-top:1px solid var(--v100); padding-top:10px; font-size:12px; color:var(--v7); }
  .agcard{ border:1.5px solid var(--line); border-radius:14px; padding:16px; background:#fff; display:flex; flex-direction:column; }
  .agcard .top{ display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; } .agcard .nm{ font-size:14px; font-weight:700; display:flex; gap:8px; align-items:center; }
  .agtag{ font-size:10px; font-weight:800; letter-spacing:.05em; border:1px solid currentColor; border-radius:6px; padding:1px 7px; opacity:.8; }
  .agcard p{ font-size:12.5px; color:#475569; line-height:1.5; margin:0 0 12px; flex:1; }
  .agcard .ep{ border-top:1px solid #f1f3f6; padding-top:9px; font-size:11.5px; color:var(--muted); }
  .ac-amber{ border-color:#fcd34d; background:#fffdf5;} .ac-amber .nm{color:#b45309;} .ac-red{border-color:#fca5a5;background:#fffafa;} .ac-red .nm{color:#b91c1c;}
  .ac-violet{border-color:#93c5fd;background:#f5faff;} .ac-violet .nm{color:var(--v7);} .ac-green{border-color:#6ee7b7;background:#f6fffb;} .ac-green .nm{color:#047857;}
  .ac-slate{border-color:#cbd5e1;background:#fcfcfd;} .ac-slate .nm{color:#334155;} .ac-blue{border-color:#93c5fd;background:#f8fbff;} .ac-blue .nm{color:#1d4ed8;}
  .ac-teal{border-color:#5eead4;background:#f5fffd;} .ac-teal .nm{color:#0f766e;}
  /* decision + synth */
  .decision{ color:#fff; border-radius:11px; padding:13px; text-align:center; margin-bottom:12px; } .decision .d{ font-size:20px; font-weight:800; } .decision .c{ font-size:13px; opacity:.92; }
  .reasons{ padding-left:18px; margin:6px 0; } .reasons li{ font-size:13.5px; color:#334155; margin:3px 0; }
  .bar{ height:8px; border-radius:999px; background:#eef1f5; overflow:hidden; } .bar>div{ height:100%; }
  .synth{ border:1px solid #bfdbfe; background:#faf8ff; border-radius:13px; padding:16px; margin-top:16px; } .synth p{ white-space:pre-wrap; line-height:1.6; font-size:14px; color:#334155; }
  .pill{ font-size:11px; padding:2px 9px; border-radius:999px; font-weight:600; } .pill.hit{background:#dbeafe;color:#1d4ed8;} .pill.live{background:#d1fae5;color:#047857;}
  .actions{ border:1px solid var(--line); background:#fff; border-radius:13px; padding:16px; margin-top:16px; display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  .ok{ color:#047857; font-weight:600; font-size:13px; }
  /* slider */
  .srow{ display:flex; gap:10px; align-items:center; margin:10px 0; } .srow label{ width:120px; font-size:12px; color:var(--muted); } .srow .val{ width:96px; text-align:right; font-weight:700; font-size:13px; } input[type=range]{ flex:1; accent-color:var(--v); }
  /* timeline */
  .tl{ position:relative; padding-left:26px; } .tl:before{ content:''; position:absolute; left:8px; top:4px; bottom:4px; width:2px; background:var(--line); }
  .tlitem{ position:relative; padding:6px 0 14px; } .tldot{ position:absolute; left:-22px; top:8px; width:13px; height:13px; border-radius:50%; border:2px solid #fff; }
  .tlitem b{ font-size:13.5px; } .tlitem .w{ font-size:11px; color:#94a3b8; } .tlitem p{ font-size:13px; color:#475569; margin:2px 0 0; }
  .doc{ display:flex; align-items:center; gap:8px; font-size:13px; padding:6px 0; border-bottom:1px solid #f4f5f8; } .doc:last-child{border:0;}
  .dot{ width:9px;height:9px;border-radius:50%; flex-shrink:0; }
  .ph{ background:repeating-linear-gradient(45deg,#fafbfc,#fafbfc 10px,#f1f3f6 10px,#f1f3f6 20px); border:1px dashed #cbd5e1; border-radius:11px; padding:14px; color:#94a3b8; } .ph b{ color:#64748b; display:block; font-size:13px; margin-bottom:3px; } .uc{ font-size:9px; text-transform:uppercase; letter-spacing:.06em; color:#b45309; background:#fef3c7; border-radius:999px; padding:1px 7px; }
  .disclaimer{ background:#fffbeb; border:1px solid #fcd34d; border-radius:12px; padding:13px 16px; font-size:12px; color:#92400e; line-height:1.5; margin-bottom:22px; }
  .fab{ position:fixed; bottom:22px; right:22px; background:var(--v); color:#fff; border:0; border-radius:999px; padding:12px 18px; font-weight:700; font-size:13px; cursor:pointer; box-shadow:0 8px 24px rgba(37,99,235,.4); display:flex; gap:8px; align-items:center; }
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand" onclick="go('home')" style="cursor:pointer" title="Home"><div class="logo">🛡️</div><div><b>Claims Workbench</b><small>Bricksurance SE</small></div></div>
    <nav class="nav" id="nav"></nav>
    <div class="foot">
      <div class="learncard" onclick="go('learn')"><div class="lic">🎓</div><div><b>Learn</b><small>How claims handling works</small></div></div>
      <div class="ctl"><div><div class="ctl-l">AI mode</div></div><button class="pill" id="cacheBtn" onclick="toggleCache()">…</button></div>
      <div class="ctl"><div><div class="ctl-l">Force refresh</div><div class="ctl-s">Clear webpage cache.</div></div><button class="pill gray" onclick="location.reload()">↻ REFRESH</button></div>
      <div class="ctl"><div><div class="ctl-l">Reset demo</div><div class="ctl-s" id="resetMsg"></div></div><button class="pill" id="resetBtn" onclick="resetDemo()">↺ RESET</button></div>
      <div class="ftag">Synthetic demo accelerator — not a Databricks product.</div>
    </div>
  </aside>
  <div class="main"><div class="content"><div class="wrap" id="view"></div></div></div>
</div>
<button class="fab" onclick="go('claimsai')">🤖 Claims AI</button>
<script>
// Persona lanes — a viewer self-locates in 2 seconds. Worklists / Roadmap stay
// routable as drill-downs (reached from Control Tower / Learn) but off the nav;
// Performance + Trends fold into Insight; Enrichment is folded into the claim view.
const SECTIONS=[
  {id:'control',label:'🎛️ Control Tower',grp:'Head of Claims'},
  {id:'insight',label:'📊 Insight',grp:'Head of Claims'},
  {id:'myqueue',label:'👩‍💼 My Queue',grp:'Handler'},
  {id:'fnol360',label:'🛰️ FNOL 360',grp:'Handler'},
  {id:'claim',label:'📋 Work a claim',grp:'Handler'},
  {id:'newclaim',label:'➕ Try a claim',grp:'Handler'},
  {id:'fraud',label:'🔍 Fraud & SIU',grp:'Fraud & SIU'},
  {id:'ingestion',label:'📥 Ingestion',grp:'Data & Governance'},
  {id:'governance',label:'🛡️ Governance',grp:'Data & Governance'},
  {id:'claimsai',label:'🤖 Claims AI',grp:'The platform'},
];
const state={ section:'home', host:'', cid:'cc:900001', claims:[], panels:null, synth:null, disp:null, reason:null, confirmation:null, overriding:false,
  ct:null, lens:null, cfg:null, ask:null, asking:false, roster:null, govtab:'collected', gcid:'cc:900001', track:null, trackCid:'cc:900001',
  queue:null, nc:null };
const gbp=v=>{const n=parseFloat(v);return isNaN(n)?'—':'£'+n.toLocaleString('en-GB',{maximumFractionDigits:0});};
const num=v=>{const n=parseFloat(v);return isNaN(n)?'—':n.toLocaleString('en-GB');};
const pct=v=>{const n=parseFloat(v);return isNaN(n)?'—':n.toFixed(1)+'%';};
const DLABEL={pay_direct:'PAY DIRECT',escalate:'ESCALATE',refer_siu:'REFER TO SIU'};
const PERIL={motor_tp:'Motor Third Party',home_escape_water:'Home — Escape of Water',home_storm:'Home — Storm',home_fire:'Home — Fire'};
const esc=s=>(s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// Minimal, safe markdown -> HTML for agent responses (escape first, then format).
function mdfmt(s){ if(!s)return ''; let t=esc(s);
  t=t.replace(/^\s*#{1,4}\s*(.+)$/gm,'<b>$1</b>');
  t=t.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
  t=t.replace(/(^|[^*])\*([^*\n]+?)\*/g,'$1<i>$2</i>');
  const lines=t.split(/\n/); let out='',ul=false,ol=false;
  const close=()=>{ if(ul){out+='</ul>';ul=false;} if(ol){out+='</ol>';ol=false;} };
  for(const ln of lines){ const x=ln.trim(); let m;
    if(!x){ close(); continue; }
    if(m=x.match(/^[-•]\s+(.*)/)){ if(!ul){close();out+='<ul style="margin:4px 0 6px 18px">';ul=true;} out+='<li style="margin:2px 0">'+m[1]+'</li>'; }
    else if(m=x.match(/^\d+[.)]\s+(.*)/)){ if(!ol){close();out+='<ol style="margin:4px 0 6px 18px">';ol=true;} out+='<li style="margin:2px 0">'+m[1]+'</li>'; }
    else { close(); out+='<p style="margin:6px 0">'+x+'</p>'; }
  }
  close(); return out;
}
async function J(p,o){const r=await fetch('/api'+p,{headers:{'Content-Type':'application/json'},...o});if(!r.ok)throw new Error(r.status);return r.json();}

function renderNav(){ let h='',g=''; for(const s of SECTIONS){ if(s.grp!==g){g=s.grp;h+=`<div class="navhd">${g}</div>`;} h+=`<a class="${state.section===s.id?'on':''}" onclick="go('${s.id}')">${s.label}</a>`; } document.getElementById('nav').innerHTML=h; }
function go(s){ state.section=s;
  // Cancel any in-flight render that's still writing to the screen you just left: swap
  // #view for a fresh node, so a slow async render that resolves *after* you navigate
  // writes into a now-detached element instead of clobbering the page you're on.
  const ov=document.getElementById('view'); if(ov){ ov.replaceWith(ov.cloneNode(false)); }
  renderNav(); render(); window.scrollTo(0,0); }
// Returns #view only while `section` is still the active screen — sync sub-views that
// re-query #view after an await use this so a stale callback can't overwrite a new page.
function liveView(section){ return state.section===section ? document.getElementById('view') : null; }
async function initFoot(){ try{const d=await J('/cache-mode');state.cache=d.use_cache;}catch(e){state.cache=true;}
  const b=document.getElementById('cacheBtn'); b.className='pill'+(state.cache?'':' live'); b.textContent=state.cache?'⬡ CACHED':'● LIVE';
  try{const r=await J('/reset-status');const rb=document.getElementById('resetBtn');if(!r.available){rb.disabled=true;rb.title='Reset job not found on this workspace';}}catch(e){} }
async function toggleCache(){ const d=await J('/cache-mode',{method:'POST',body:JSON.stringify({use_cache:!state.cache})}); state.cache=d.use_cache; const b=document.getElementById('cacheBtn'); b.className='pill'+(state.cache?'':' live'); b.textContent=state.cache?'⬡ CACHED':'● LIVE'; }
let _rt=null;
async function resetDemo(){ const m=document.getElementById('resetMsg'); m.textContent='Triggering…'; try{const d=await J('/reset-demo',{method:'POST',body:'{}'}); if(!d.triggered){m.textContent=d.message||'unavailable';return;} document.getElementById('resetBtn').disabled=true; pollReset(d.run_id,Date.now());}catch(e){m.textContent='unavailable';} }
function pollReset(rid,t0){ const m=document.getElementById('resetMsg'); clearInterval(_rt); const tick=async()=>{try{const r=await J('/reset-run?run_id='+rid);const mins=Math.round((Date.now()-t0)/60000);
  const lc=(r.life_cycle||''),res=(r.result||'');
  // Terminal = any of TERMINATED / INTERNAL_ERROR / SKIPPED, or a result_state is set.
  const done=/TERMINATED|INTERNAL_ERROR|SKIPPED/.test(lc)||res!==''||mins>=30;
  if(done){clearInterval(_rt);document.getElementById('resetBtn').disabled=false; const ok=res.includes('SUCCESS'); m.textContent=ok?'✓ Reset complete':(mins>=30&&!res?'Reset timed out — check the job':'Reset failed — check the job'); if(ok)location.reload();}
  else{m.textContent=`Reset running… ${mins}m`;}}catch(e){}}; tick(); _rt=setInterval(tick,15000); }
function render(){ const f={home:renderHome,control:renderControl,insight:renderInsight,myqueue:renderMyQueue,fnol360:renderFnol360,worklists:renderWorklists,claim:renderClaim,newclaim:renderNewClaim,claimsai:renderClaimsAI,fraud:renderFraud,ingestion:renderIngestion,governance:renderGovernance,learn:renderLearn,roadmap:renderRoadmap}[state.section]; if(f)f(); }
function openWork(cid){ state.cid=cid; state.panels=null; state.synth=null; state.disp=null; state.reason=null; state.confirmation=null; state.expertOps={}; go('claim'); }
function goWork(kind){ state.worklistKind=kind; go('worklists'); }
const RAGC={green:'#10b981',amber:'#f59e0b',red:'#ef4444',info:'#94a3b8'};
const fmtv=(v,f)=>f==='gbp'?gbp(v):f==='pct'?pct(v):f==='days'?((v??'—')+' d'):num(v);
function trendArrow(tr){ if(!tr||tr.dir==='flat')return ''; const c=tr.good?'#059669':'#dc2626'; const ar=tr.dir==='up'?'▲':'▼'; return ` <span style="color:${c};font-size:11px;font-weight:700">${ar}${Math.abs(tr.delta)}</span>`; }
// One-line "what this is / vs the screen it resembles" caption, keyed by section, so a
// demoer never fumbles the distinction live. Injected by page() under the headline.
const VS_CAPTION={
  control:"Your action cockpit — targets, alerts and the auto-close dial. To explore the raw dashboard, see <b>Insight</b>.",
  insight:"The live Databricks dashboard + Genie to ask the book anything. For targets &amp; what-to-do, see <b>Control Tower</b>.",

function spark(series,key,color,lowerBetter){ const vals=series.map(r=>parseFloat(r[key])).filter(x=>!isNaN(x)); if(!vals.length)return ''; const mn=Math.min(...vals),mx=Math.max(...vals),rng=(mx-mn)||1,W=260,H=46;
  const pts=vals.map((x,i)=>`${(i/(vals.length-1)*W).toFixed(1)},${(H-((x-mn)/rng)*H).toFixed(1)}`).join(' ');
  const first=vals[0],last=vals[vals.length-1]; const good=lowerBetter?last<first:last>first; const dc=good?'#059669':'#dc2626';
  return `<svg width="${W}" height="${H}" style="overflow:visible"><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2"/><circle cx="${W}" cy="${(H-((last-mn)/rng)*H).toFixed(1)}" r="3" fill="${dc}"/></svg>`; }
function trendsBody(d){ const s=d.series||[]; if(!s.length) return '<div class="card"><p class="muted">No history yet — run the metrics snapshot (13_cco_metrics) or a reset to seed the series.</p></div>';

  return `<div class="grid2">
      ${card('% Auto-closed','pct_auto_closed','#2563eb','pct',false)}
      ${card('Leakage rate','leakage_rate','#f59e0b','pct',true)}

    </div>`;
}

async function doTrack(){ const inp=document.getElementById('trackinput'); if(inp)state.trackCid=inp.value.trim()||state.trackCid; const b=document.getElementById('trackbody'); if(!b)return; b.innerHTML='<p class="muted">Loading…</p>';

  const gaps=d.gaps.length?`<ul style="margin:6px 0 0;padding-left:18px">${d.gaps.map(g=>`<li style="font-size:13px;color:#b45309;margin:3px 0">${esc(g)}</li>`).join('')}</ul>`:'<p class="ok">✓ Nothing outstanding — a complete, clean file.</p>';
  b.innerHTML=`<div class="card" style="margin-bottom:16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap"><div><div class="eyebrow">${esc(state.trackCid)}</div><div style="font-size:18px;font-weight:800">${esc(PERIL[c.peril_type]||c.peril_type)} · ${gbp(c.total_incurred)}</div></div>
      ${d.closed?'<span class="badge b-green">closed</span>':''}
      <span class="badge ${d.disposition==='auto_closed'?'b-green':'b-amber'}">${esc((d.disposition||'').replace('_',' ')||'—')}</span>

      <div style="text-align:right"><div class="muted">Document completeness</div><div style="font-size:20px;font-weight:800;color:${d.doc_complete_pct===100?'#059669':'#b45309'}">${d.doc_complete_pct}%</div></div></div>
    <div class="grid2">
      <div class="card"><h2>🕒 Lifecycle</h2><div class="tl">${tl}</div></div>
      <div style="display:flex;flex-direction:column;gap:16px">

        <div class="card" style="border-color:#fcd34d;background:#fffbeb"><h2>⚠️ What's outstanding</h2>${gaps}<p class="muted" style="margin-top:6px">The gaps a head of claims can't easily see today — surfaced in one view.</p></div>

}

const GLOSSARY=[['FNOL','First Notice of Loss — the moment a claim is first reported. The trigger for everything downstream.'],['Triage','Deciding how to handle a claim at FNOL: pay directly, escalate to a handler, or refer to the fraud unit (SIU).'],['Reserve','Money set aside for a claim before it is fully paid. Under-reserving means surprises later.'],['Indemnity','Putting the policyholder back where they were before the loss — the core promise of insurance.'],['Subrogation / Recovery','Recovering money from a third party (or their insurer) when they were at fault.'],['Leakage','Money paid out that need not have been — overpayment, missed recovery, or poor handling.'],['SIU','Special Investigations Unit — the fraud team a claim is referred to when signals are elevated.'],['Peril','The cause of loss — e.g. motor third-party, escape of water, storm, fire.'],['Loss ratio','Claims incurred ÷ premium earned. The headline measure of underwriting profitability.'],['Straight-through processing','A clean, low-risk claim auto-closed and paid with no manual handling — the auto-close path here.'],['Ultimate / outstanding','Ultimate = total the claim will ever cost; outstanding = what is still reserved but unpaid.'],['Consumer Duty / FCA','UK regulatory expectations — fair, explainable, auditable treatment of customers.']];

const LIFECYCLE=[

  ['Triage','Sort by what it needs','Severity × complexity → auto-pay, standard, or investigate. Sets the initial reserve bracket and the routing.','#2563eb'],
  ['Coverage & validation','Is it covered? Is it real?','Two different questions — the contract (peril, exclusions, limits) and the facts (did it happen as stated, is the amount right).','#2563eb'],
  ['Reserving','Put a number on it','Money set aside for the expected ultimate cost — best estimate, not paid-so-far, not padded. Case reserves reconcile to actuarial.','#2563eb'],
  ['Handling','Drive to resolution','Investigation, vendors, negotiation. Aging is the enemy — open claims accrue cost and litigation risk. Right work to right grade.','#64748b'],
  ['Settlement','Agree and pay','The payout moment — basis of settlement, excess, limits, betterment. CX and leakage are decided here at once. Usually full & final.','#059669'],

  ['Closure','Shut the file','Reserve down to paid; or Closed Without Pay. Reopen rate is the quality alarm — closing too early to hit cycle-time is metric-gaming.','#64748b'],

const LEARN_PANELS=[
  {id:'lifecycle', n:1, icon:'🔄', title:'The claim lifecycle — end to end',
   subtitle:'FNOL to closure. The front of the claim decides the cost of the claim.',
   body:`<p><b>Claims is where the insurance promise actually gets paid</b> — and it's the single biggest cost line an insurer has. A policyholder suffers a loss, reports it, and the insurer decides how to handle it, sets money aside, pays what's owed, claws back anything recoverable, and closes the file with an audit trail. Do that faster and fairer and you win on cost, customer experience and regulatory standing at once.</p>
   <p>Every decision trades off <b>four forces that fight each other</b>: paying the right amount (<i>indemnity</i>), the cost to handle it (<i>expense</i>), the customer's <i>experience</i>, and keeping <i>fraud</i> out. And one rule dominates everything: <b>the front of the claim decides the cost of the claim.</b> Triage, reserve and routing in the first hours set the trajectory — get the front door wrong and you pay for it the whole life of the claim.</p>
   <p>Two numbers you'll see everywhere. <b>Leakage</b> — money that left the door that needn't have (missed exclusions, over-payment, missed recoveries, vendor cost): mostly self-inflicted, up to ~10% of claims spend, and the most controllable cost lever there is. And <b>Incurred = Paid + Outstanding reserve + IBNR</b> — the total expected cost of a claim, and the foundation everything financial is built on.</p>`,

   links:[['See the reserve model','claim'],['See reserve adequacy','control']]},
  {id:'handling',n:6,icon:'🛠️',title:'Handling — drive the claim to resolution',subtitle:'The handler is a portfolio manager. Aging is the enemy.',
   body:`<p>The ongoing work — investigation, vendor management, negotiation, communication — that moves an accepted claim to ready-to-settle. The skill is knowing which file to touch today. Open claims accrue cost and litigation risk, so <b>aging is the enemy</b>.</p><p>The biggest levers are vendor / supply-chain control and avoiding unnecessary litigation — and putting the right work in front of the right grade.</p>`,
   diagram:_lrow(_lcard('Aging is the enemy','Every day open adds cost and litigation risk.','#b45309'),_lcard('Vendor & supply-chain control','The largest controllable handling cost.','#2563eb'),_lcard('Right work → right grade',"Don't put a specialist on a fast-track file.",'#64748b')),
   links:[['See the handler queue (My Queue)','myqueue']]},
  {id:'settlement',n:7,icon:'💳',title:'Settlement — agree and pay the number',subtitle:'CX and leakage are decided here at once. Usually full & final.',
   body:`<p>The payout moment — cash, in-kind (repair / replace), or structured (injury). Apply the basis of settlement (new-for-old vs indemnity), excess, limits, betterment. Authority limits gate large payouts, and it's usually full & final, so get it right.</p><p>Speed-vs-control is sharpest here: auto-pay the simple claims, but excess, limits, fraud and authority must still apply.</p>`,
   diagram:_lrow(_lcard('Speed','Auto-pay simple, clean claims — instant.','#059669'),_lcard('Control','Excess · limits · fraud · authority still enforced.','#dc2626'))+_lnote('The auto-close path settles in seconds — but only inside the risk band, with policy mechanics enforced.'),
   links:[['See the auto-close & pay path','control'],['See a disposition','claim']]},
  {id:'recovery',n:8,icon:'💷',title:"Recovery — get money back after you've paid",subtitle:'The most under-exploited lever. Spot it early.',
   body:`<p>Three routes: <b>subrogation</b> (chase the at-fault third party), <b>salvage</b> (sell the damaged property you now own), and reinsurance & other recoveries. It's the most under-exploited lever in claims.</p><p>Spot it <b>early</b> — flag third-party / at-fault at FNOL. Evidence decays and limitation periods are hard deadlines. A claim's true cost is <code>paid − recoveries</code>.</p>`,
   diagram:_lflow(['Subrogation','Salvage','Reinsurance & other'],'b-green')+_lnote("Flag third-party-at-fault at FNOL — recover late and you don't recover at all."),
   links:[['See the Recovery agent','claimsai'],['Recovery on the table','control']]},
  {id:'closure',n:9,icon:'✅',title:'Closure — and reopening',subtitle:'Reopen rate is the quality alarm. Beware metric-gaming.',
   body:`<p>The claim is resolved, the file shut, and the reserve taken down to paid. This includes <b>Closed Without Pay</b> (declined / withdrawn / no liability). Watch the <b>reopen rate</b> — high reopens mean you're closing too early.</p><p>The tail matters: property is short-tail; liability and injury are long-tail (open for years), where reserving is hardest. Premature closure to hit a cycle-time target creates reopens and leakage — classic metric-gaming.</p>`,
   diagram:_lrow(_lcard('Short-tail','Property — closes fast, reserves settle quickly.','#059669'),_lcard('Long-tail','Liability / injury — open for years, hardest to reserve.','#b45309'))+_lnote('Always pair a speed target with a quality counter-metric (reopen rate, leakage).'),
   links:[['See disposition & CWP','control']]},
  {id:'fraud',n:10,icon:'🛡️',title:'Fraud — a lens, not a stage',subtitle:"Friction vs leakage. You can't decline on suspicion — you need evidence.",
   body:`<p>Fraud runs along a spectrum: opportunistic / soft (inflating a genuine claim — the bulk) → hard / premeditated (staged, fabricated) → organised rings (crash-for-cash) → internal. Signals: late reporting, a claim soon after inception or before lapse, prior-claim frequency, story-vs-evidence inconsistency, pressure to settle.</p><p>The unit is the SIU; the skill is triaging which to investigate (cost vs amount). <b>Hit rate</b> is the KPI — good is 3–4%, weak is under 1%, and that gap is leakage. The tension is friction vs leakage: investigate too hard and you punish honest customers; too light and fraud walks.</p>`,
   diagram:_lflow(['Soft / opportunistic','Hard / premeditated','Organised rings','Internal'],'b-red')+_lnote('Hit rate: good 3–4% · weak <1%. The deterministic gate can flag; only a human can decline on evidence.'),
   links:[['See Fraud & SIU','fraud'],['See the Fraud agent','claimsai']]},
  {id:'financial',n:11,icon:'📈',title:'The financial roll-up',subtitle:'Reserving sits at the centre. Claims data is the pricing input.',
   body:`<p>The unifying thread: a handler's case reserve → portfolio <b>incurred</b> → <b>loss ratio</b> → <b>combined ratio</b> (the headline insurer metric; under 100% = underwriting profit) → P&L → pricing → capital → reinsurance.</p><p>Reserving sits at the centre — it's simultaneously an ops figure, an accounting liability, an actuarial estimate, and a capital input. Claims experience (frequency, severity, development) is the raw material the actuary prices on: claims data <i>is</i> the pricing input.</p>`,
   diagram:_lflow(['Case reserve','Incurred','Loss ratio','Combined ratio','P&L','Pricing','Capital'],'b-blue'),
   links:[['See loss / combined ratio','control'],['Ask Pricing + Claims (Genie)','claimsai']]},
  {id:'mi',n:12,icon:'📊',title:'MI & the KPI framework',subtitle:'Efficiency and Effectiveness. The prize is leading, not lagging.',
   body:`<p>Leadership runs the book on two families: <b>Efficiency</b> (cycle time, productivity, % closed within target, aged claims) and <b>Effectiveness</b> (severity, leakage, recovery, reserve accuracy, fraud, customer satisfaction), plus the financials. 5–10 CxO KPIs sit over layers of support metrics.</p><p>The gaming trap: a speed target drives premature closure — so always pair it with a quality counter-metric. Most MI is <b>lagging</b>; the prize is <b>leading</b> indicators. The shift is predict-and-prevent, not report-the-past.</p>`,
   diagram:_lrow(_lcard('Efficiency','Cycle time · productivity · % within target · aged claims','#2563eb'),_lcard('Effectiveness','Leakage · recovery · reserve accuracy · fraud · CSAT','#059669'))+_lnote('Lagging reports the past; leading prevents the loss. Genie makes the whole book self-serve.'),
   links:[['See the Control Tower','control'],['See Insight','insight'],['Ask the book (Genie)','claimsai']]},
  {id:'regulation',n:13,icon:'🤝',title:'Customer & regulation',subtitle:"Governance isn't a checkbox — it's the enabler of automation.",
   body:`<p>Claims is the only time most customers use the product — it drives renewal more than the sale. They want speed, fairness, no repetition, and to be kept informed. Regulation: FCA <b>Consumer Duty</b> (you must <i>evidence</i> good outcomes, not just assert them), TCF, ICOBS, the Ombudsman, vulnerable customers — plus AI-specific duties: explainability, bias, the right to human review.</p><p>The reframe: the real blocker to auto-deciding claims is conduct fear ("can we defend this to the FCA?"). Governance removes it. Doing automation <i>and</i> governance together is the unlock.</p>`,
   diagram:`<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px">${[['"Show your reasoning"','agent-reasoning audit log'],['Explainable decisions','triage reasons + "passed all checks" + model cards'],['Right to human review','HITL'],['Fairness','consistent, auditable rules'],['Sensitive data','Secret tier + masking + CMK'],['Prove the data','lineage']].map(c=>`<div style="border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff;font-size:12px"><b>${c[0]}</b><div class="muted" style="margin-top:2px">→ ${c[1]}</div></div>`).join('')}</div>`,
   links:[['See Governance','governance']]},
  {id:'pitch',n:14,icon:'🎯',title:'The pitch — FNOL is the whole game',subtitle:'Two layers. The agent escalates but never auto-approves.',
   body:`<p>Everything downstream is decided at the front door, so the highest-leverage thing in claims is getting more right at FNOL. And that's a <b>Databricks</b> problem specifically: rich FNOL is data-integration + real-time enrichment + AI — assemble policy, history, third-party, weather, fraud, telematics and similar claims, instantly, at the moment of the call. Guidewire is the system of record; the lakehouse is the system of intelligence.</p><p>The auto-close rate = data completeness × claim simplicity at a chosen risk appetite — and you raise it by <b>adding data, not loosening the threshold</b>. Personal lines (high-volume, homogeneous) has a higher ceiling than specialty. Governance is what makes a high auto-close rate deployable in a regulated market.</p>`,
   diagram:_lrow(_lcard('Layer 1 — the engine (deterministic)','Assemble data · ML (fraud, severity, triage, reserve) · rules · risk-appetite thresholds. Decides what auto-closes.','#2563eb'),_lcard('Layer 2 — the second opinion (agent)','Pulls the threads together, reasons in human terms, and challenges the layer-1 call.','#2563eb'))+_lnote('Safety asymmetry: the agent can escalate but never auto-approve — it can only add caution. That is what makes a high auto-close rate defensible.'),
   links:[['See the FNOL decision','claim'],['See the AI layer','claimsai']]},
  {id:'glossary',n:15,icon:'📖',title:'Glossary',subtitle:'The vocabulary you will hear in any claims room.',
   body:`<p class="muted">Plain-English definitions for the terms used across this course and the workbench.</p>`,
   diagram:`<div style="display:grid;grid-template-columns:1fr 1fr;gap:4px 18px">${GLOSSARY.map(g=>`<div style="display:flex;gap:8px;align-items:flex-start;padding:5px 0;border-bottom:1px solid #f4f5f8"><span style="flex:0 0 132px;font-weight:700;color:#0f172a;font-size:12px">${esc(g[0])}</span><span class="muted" style="font-size:12px;line-height:1.4">${esc(g[1])}</span></div>`).join('')}</div>`,
   links:[]},
];
function setLearnSlide(i){ const n=LEARN_PANELS.length; state.learnSlide=Math.max(0,Math.min(n-1,i)); renderLearn(); window.scrollTo(0,0); }
function renderLearn(){ const v=document.getElementById('view'); const n=LEARN_PANELS.length; const i=Math.max(0,Math.min(n-1,state.learnSlide||0)); const p=LEARN_PANELS[i];
  const toc=`<aside style="position:sticky;top:8px;align-self:start">
    <div class="card" style="padding:12px">
      <div class="eyebrow">Learn claims</div><div style="font-weight:800;font-size:14px;margin:2px 0 10px">${n} slides</div>
      <ol style="list-style:none;margin:0;padding:0;font-size:13px">${LEARN_PANELS.map((q,j)=>`<li style="margin:1px 0"><a class="link" style="display:flex;gap:7px;align-items:flex-start;padding:5px 7px;border-radius:8px;${j===i?'background:var(--v100);color:var(--v7);font-weight:700':'color:#475569'}" onclick="setLearnSlide(${j})"><span style="opacity:.85">${q.icon}</span><span>${q.n}. ${esc(q.title.split('—')[0].trim())}</span></a></li>`).join('')}</ol>
    </div></aside>`;
  const links=(p.links&&p.links.length)?`<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:14px">${p.links.map(l=>`<button class="ghost" style="font-size:12px" onclick="go('${l[1]}')">↗ ${esc(l[0])}</button>`).join('')}</div>`:'';
  const nav=`<div style="display:flex;justify-content:space-between;align-items:center;margin-top:20px;border-top:1px solid var(--line);padding-top:14px">
     <button class="ghost" ${i===0?'disabled style="opacity:.4"':''} onclick="setLearnSlide(${i-1})">← Prev</button>
     <span class="muted" style="font-size:12px">Slide ${i+1} of ${n}</span>
     <button class="btnv" ${i===n-1?'disabled style="opacity:.4"':''} onclick="setLearnSlide(${i+1})">Next →</button></div>`;
  const slide=`<div class="card" style="min-height:520px;display:flex;flex-direction:column">
    <div style="display:flex;gap:12px;align-items:flex-start;border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:16px">
      <div style="width:42px;height:42px;border-radius:11px;background:var(--v100);display:flex;align-items:center;justify-content:center;font-size:21px;flex-shrink:0">${p.icon}</div>
      <div><div class="eyebrow">Slide ${p.n} of ${n}</div><h1 style="font-size:25px;font-weight:800;margin:2px 0 0;letter-spacing:-.01em">${esc(p.title)}</h1><p class="muted" style="font-style:italic;margin:4px 0 0">${esc(p.subtitle)}</p></div></div>
    <div style="font-size:14px;color:#334155;line-height:1.65">${p.body}</div>
    ${p.diagram?`<div class="card" style="margin-top:16px;background:linear-gradient(135deg,#eff6ff,#fff)">${p.diagram}</div>`:''}
    ${links}
    <div style="flex:1"></div>${nav}</div>`;
  v.innerHTML=page('The platform','Learn claims','How a claim actually works, end to end — as a slide deck. Jump with the list, or step through with Next. Each slide links into the running workbench.')
    +`<div style="display:grid;grid-template-columns:248px 1fr;gap:24px;align-items:start">${toc}<div>${slide}</div></div>`;
}

// ============ ROADMAP ============
function renderRoadmap(){ document.getElementById('view').innerHTML=page('Reference','Roadmap — under construction','What this accelerator intentionally does NOT do yet. Greyed = not built — shown to frame the platform’s reach honestly.')+roadmapStrip(); }

// ============ boot ============
(async function(){ renderNav(); try{const cfg=await J('/config');state.host=cfg.workspace_host||'';state.cat=cfg.catalog||'';state.sch=cfg.schema||'';}catch(e){} await initFoot(); await loadClaims(); render(); })();
function ucLink(table){ return (state.host&&state.cat&&state.sch&&table)?`${state.host}/explore/data/${state.cat}/${state.sch}/${table}`:''; }
</script>
